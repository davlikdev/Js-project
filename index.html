<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vite App</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">
    <div class="app-wrapper">
        <div class="app-body">
            <form id="new-task-form" class="new-task-form">
                <label for="new-task-input" class="visually-hidden"></label>
                <input required placeholder="Add a new task" id="new-task-input" type="text" class="new-task-input">
                <button type="submit" class="new-task-button">
                  <span></span>
                  <span></span>
                </button>
            </form>
            <div class="task-list-wrapper">
                <h4 class="task-list-title">Tasks to do - 4</h4>
                <ul class="task-list">
                    <li class="task-list-item">
                        <div class="task-text">To study React fundamentals</div>
                        <div class="task-actions">
                            <button data-action="done" class="done-task-button task-button">
                                <img src="./public/images/done.png" height="13" width="18" alt="done task button">
                            </button>
                            <button data-action="delete" class="delete-task-button task-button">
                                <img src="./public/images/delete.png" height="19" width="18" alt="delete task button">
                            </button>
                        </div>
                    </li>

                </ul>
            </div>
          <div class="done-task-list-wrapper">
            <h4 class="task-list-title">Done - 1</h4>
            <ul class="done-task-list">
              <li class="task-list-item">
                <div class="done-task-text">To study React fundamentals</div>
              </li>
            </ul>
          </div>
        </div>
    </div>

</div>
<script type="module" src="/src/JS/main.js"></script>
</body>
</html>
