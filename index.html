<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vite App</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">
    <div class="app-wrapper">
        <div class="app-body">
            <form id="new-task-form" class="new-task-form">
                <label for="new-task-input" class="visually-hidden"></label>
                <input required placeholder="Add a new task" id="new-task-input" type="text" class="new-task-input">
                <button type="submit" class="new-task-button">
                  <span></span>
                  <span></span>
                </button>
            </form>
            <div class="task-list-wrapper">
                <h4 id="task-list-title" class="task-list-title"></h4>
                <ul class="task-list">

                </ul>
            </div>
          <div class="done-task-list-wrapper">
            <h4 id="done-task-list-title" class="task-list-title">Done - 1</h4>
            <ul class="done-task-list">

            </ul>
          </div>
        </div>
    </div>

</div>
<script type="module" src="/src/JS/main.js"></script>
</body>
</html>
